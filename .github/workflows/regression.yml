name: API Testing Regression

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Phase 1 + Phase 2 + Petstore Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run Phase 1 and Phase 2 regression tests
        run: mvn -B clean test -U

      - name: Verify Phase 1 and Phase 2 regression tests
        run: |
          echo "Phase 1 regression:"
          grep -R "Phase1RegressionTest" target/surefire-reports || true
          echo "Phase 2 regression:"
          grep -R "Phase2RegressionTest" target/surefire-reports || true
          test -f target/surefire-reports/org.ai.testing.regression.Phase1RegressionTest.txt
          test -f target/surefire-reports/org.ai.testing.regression.Phase2RegressionTest.txt

      - name: Run Petstore integration regression
        run: mvn -B compile exec:java -Dexec.mainClass="org.ai.testing.Main"

      - name: Verify generated reports
        run: |
          echo "Generated report files:"
          find reports -maxdepth 2 -type f -print
          test -f reports/test-report.html
          test -f reports/test-report.json
          test -f reports/test-report.csv

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-regression-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn

      - name: Upload generated API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: reports/**
          if-no-files-found: error

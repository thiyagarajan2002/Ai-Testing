openapi: 3.0.4

info:
  title: Swagger Petstore - OpenAPI 3.0
  version: 1.0.27

servers:
  - url: /api/v3

paths:

  /pet:
    post:
      summary: Add a new pet to the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        "200":
          description: Successful operation
        "405":
          description: Invalid input

    put:
      summary: Update an existing pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        "200":
          description: Successful operation
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found

  /pet/{petId}:
    get:
      summary: Find pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
        "400":
          description: Invalid ID supplied
        "404":
          description: Pet not found

    delete:
      summary: Delete pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "400":
          description: Invalid pet value

  /pet/findByStatus:
    get:
      summary: Finds Pets by status
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
      responses:
        "200":
          description: Successful operation
        "400":
          description: Invalid status value

components:

  schemas:

    Pet:
      type: object
      required:
        - name
        - photoUrls

      properties:
        id:
          type: integer
          format: int64

        name:
          type: string

        category:
          $ref: '#/components/schemas/Category'

        photoUrls:
          type: array
          items:
            type: string

        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

        status:
          type: string
          enum:
            - available
            - pending
            - sold

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string